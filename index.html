<!DOCTYPE html>
<html lang="ja">                                <!-- 日本語 -->

<head>
    <link rel="stylesheet" href="style.css">    <!-- css読み込み -->
    <meta charset="UTF-8">
    <title>おしゃべりメーカー</title>
</head>


<body>

<h1>おしゃべりメーカー</h1>                      <!--ヘッダー1 1は文字サイズ -->

<p>---あ の画像---</p>                          <!-- pは文章 -->
<input type="file" id="a" accept="image/*">    <!-- ファイル選択ボタン -->

<p>---い の画像---</p>
<input type="file" id="i" accept="image/*">

<p>---う の画像---</p>
<input type="file" id="u" accept="image/*">

<p>---え の画像---</p>
<input type="file" id="e" accept="image/*">

<p>---お の画像---</p>
<input type="file" id="o" accept="image/*">

<p>---ん の画像---</p>
<input type="file" id="n" accept="image/*">

<br>

<h2>読み上げ内容</h2>                           <!-- セリフ入力欄 -->
<textarea id="textInput">
こんにちは
</textarea>

<br>

<label>
<input type="checkbox" id="loopCheck">          <!-- チェックボックス ラベル選択しても切り替わる -->
ループ再生
</label>

<br>

<label>
1文字当たりの速さ
<input 
    type="range"
    id="speedSlider"
    min="50"
    max="500"
    value="200">
</label>
<span id="speedValue">200ms</span>

<br>

<button id="speakButton" onclick="speak()">
しゃべる
</button>

<button id="stopButton" onclick="stopLipSync()" disabled>
停止
</button>

<br><br>

<div class="characterArea">                     <!-- 画像表示位置グループ -->
    <img id="characterImage" width="400">
    <div id="currentText"></div>
</div>

<script src="script.js"></script>               <!-- js読み込み -->

</body>

</html>
