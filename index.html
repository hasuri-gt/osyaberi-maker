<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>口パクアプリ</title>
<link rel="stylesheet" href="style.css">
</head>


<body>


<h1>キャラクター口パク</h1>


<div>
<img id="characterImage">
</div>


<h2>画像登録</h2>


<p>あ</p>
<input type="file" id="a" accept="image/*">


<p>い</p>
<input type="file" id="i" accept="image/*">


<p>う</p>
<input type="file" id="u" accept="image/*">


<p>え</p>
<input type="file" id="e" accept="image/*">


<p>お</p>
<input type="file" id="o" accept="image/*">


<p>ん</p>
<input type="file" id="n" accept="image/*">



<h2>セリフ</h2>

<textarea id="textInput">
こんにちは
</textarea>


<br>

<button onclick="speak()">
しゃべる
</button>



<script src="script.js"></script>


</body>

</html>
