<!DOCTYPE html>
<html lang="ja">

<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">

<title>おしゃべりメーカー</title>

</head>

<body>
<h1>おしゃべりメーカー</h1>

<p>---あ の画像---</p>
<input type="file" id="a" accept="image/*">

<p>---い の画像---</p>
<input type="file" id="i" accept="image/*">

<p>---う の画像---</p>
<input type="file" id="u" accept="image/*">

<p>---え の画像---</p>
<input type="file" id="e" accept="image/*">

<p>---お の画像---</p>
<input type="file" id="o" accept="image/*">

<p>---ん の画像---</p>
<input type="file" id="n" accept="image/*">

<br>

<div class="characterArea">
    <img id="characterImage" width="400">
    <div id="currentText"></div>
</div>

<br><br>

<h2>読み上げ内容</h2>

<textarea id="textInput">
こんにちは
</textarea>

<br>

<label>
<input type="checkbox" id="loopCheck">
ループ再生
</label>

<br>

<button id="speakButton" onclick="speak()">
しゃべる
</button>

<button id="stopButton" onclick="stopLipSync()" disabled>
停止
</button>

<script src="script.js"></script>

</body>
</html>
